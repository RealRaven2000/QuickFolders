<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16">
  <style>
   :root {
      --fill-opacity: context-fill-opacity;
   }

   @media (prefers-color-scheme: light) {
      :root {
         --basiccolor: context-fill rgb(20,20,20);
         --fill: var(--basiccolor);
         --stroke: color-mix(in srgb,var(--basiccolor) 20%,transparent);
      }
   }

   @media (prefers-color-scheme: dark) {
      :root {
        --basiccolor: context-fill rgb(251,251,254);
        --fill: var(--basiccolor);
        --stroke: color-mix(in srgb,var(--basiccolor) 20%,transparent);
      }
   }
  </style> 
