<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <style>
   :root {
      --fill-opacity: context-fill-opacity;
      --fill: context-fill; /* fallback for TB before 120 */
      --fill: context-fill light-dark(rgb(20,20,20), rgb(251,251,254));
      --stroke: context-stroke; /* fallback for TB before 120 */
      --stroke: color-mix(in srgb, var(--fill) 20%, transparent);
   }
   @media (prefers-color-scheme: light) {
      :root {
         --plus: rgb(3, 162, 3);
      }
   }

   @media (prefers-color-scheme: dark) {
      :root {
        --plus: rgb(255, 213, 0);
      }
   }
  </style>  

  <!-- Tab shape -->
  <path 
    style="fill:var(--fill);fill-opacity:var(--fill-opacity);stroke:var(--stroke);" 
    d="M11 11V9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v6H1a1 1 0 0 0 0 2h7v-1a1 1 0 0 1 1-1z"/>

  <!-- Plus icon -->
  <path 
    style="fill:var(--plus);" 
    d="M12 9.5v2h-2v1h2v2h1v-2h2v-1h-2v-2h-1z"/>
</svg>
